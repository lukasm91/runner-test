name: NVHPC Test Job

on:
  workflow_call:
    inputs:
      nvhpc:
        required: true
        type: string
      image:
        required: true
        type: string
      variant:
        required: true
        type: string
      compile_flags:
        required: false
        type: string
        default: ""
      run_env:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: NVHPC ${{ inputs.nvhpc }} / ${{ inputs.variant }}
    runs-on: ubuntu-latest
    env:
      NVHPC_IMAGE: ${{ inputs.image }}
      COMPILE_FLAGS: ${{ inputs.compile_flags }}
      RUN_ENV: ${{ inputs.run_env }}

    steps:
      - name: Check runner CPU
        id: cpu
        run: |
          cat /proc/cpuinfo

          if grep -Fq "AMD EPYC 9V74 80-Core Processor" /proc/cpuinfo; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
            echo "Target CPU not found; passing this job without running the test."
          fi

      - name: Check out repository
        if: steps.cpu.outputs.run_tests == 'true'
        uses: actions/checkout@v4

      - name: Compile and run test.f90
        if: steps.cpu.outputs.run_tests == 'true'
        run: |
          docker run --rm --pull always \
            -e COMPILE_FLAGS \
            -e RUN_ENV \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$NVHPC_IMAGE" \
            bash -lc '
              set -x
              nvfortran -fast -O3 ${COMPILE_FLAGS} -v test.f90 -o out
              env ${RUN_ENV} ./out
              run_rc=$?
              echo "./out returned ${run_rc}"
              exit "${run_rc}"
            '
