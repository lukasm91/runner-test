name: NVHPC Matrix Test

on:
  push:
    branches:
      - main

jobs:
  cpuinfo:
    name: NVHPC ${{ matrix.config.nvhpc }} / ${{ matrix.variant.name }} / run ${{ matrix.repeat }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3, 4, 5]
        config:
          - nvhpc: "25.1"
            image: nvcr.io/nvidia/nvhpc:25.1-devel-cuda12.6-ubuntu22.04
          - nvhpc: "26.1"
            image: nvcr.io/nvidia/nvhpc:26.1-devel-cuda13.1-ubuntu22.04
          - nvhpc: "26.3"
            image: nvcr.io/nvidia/nvhpc:26.3-devel-cuda13.1-ubuntu22.04
        variant:
          - name: default
            compile_flags: ""
            run_env: ""
          - name: tp-haswell
            compile_flags: "-tp=haswell"
            run_env: ""
          - name: mth-iarch-avx2
            compile_flags: ""
            run_env: "MTH_IARCH=avx2"

    steps:
      - name: Print /proc/cpuinfo
        run: cat /proc/cpuinfo

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile and run ${{ matrix.variant.name }} test.f90 in NVIDIA HPC SDK ${{ matrix.config.nvhpc }} container
        run: |
          docker run --rm --pull always \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "${{ matrix.config.image }}" \
            bash -lc '
              set -x
              nvfortran -fast -O3 ${{ matrix.variant.compile_flags }} -v test.f90 -o out
              ${{ matrix.variant.run_env }} ./out
              run_rc=$?
              echo "./out returned ${run_rc}"
              exit "${run_rc}"
            '
